protocol_status:
  frozen: true
  confirmed_by: Yanzhao Deng (accountable author and Codex task user)
  confirmed_at: "2026-07-29T21:10:31+08:00"
  notes: >-
    Protocol v4 terminated after its consumed CIFAR-100 health failure. The
    accountable author and Codex task user then authorized completion of the
    prerequisites. Two development-only v5 design probes completed at commit
    609a505445d68e9961778999b5f7a4bc79cc83a8 without integrity anomalies.
    Their natural-data learning metrics were descriptive and were not used to
    set any v5 health criterion. V5 health is a deterministic implementation
    gate with no performance threshold. Health, pilot, formal, bootstrap, and
    development seed identities are mutually disjoint. Formal execution stays
    blocked until both one-shot health gates and all four 120-epoch pilots pass
    and the v5 freeze manifest verifies.
