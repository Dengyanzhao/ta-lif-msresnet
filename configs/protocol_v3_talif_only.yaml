protocol_version: 3
study_stage: pilot_and_formal
active_conditions: [C1, C2]

# These five seeds form paired C1/C2 blocks in both datasets. Historical and
# engineering-only seeds are retired and cannot be substituted.
seeds: [1882214332, 836017246, 126468528, 2075015328, 419442269]
output_root: results/formal_v3_talif_only

artifact_paths:
  protocol: configs/protocol_v3_talif_only.yaml
  signoff: PREREGISTRATION_SIGNOFF_V3_TALIF_ONLY.md
  formal_matrix: configs/v3_talif_only_generated
  pilot_matrix: configs/v3_talif_only_pilot_generated
  freeze_manifest: FREEZE_MANIFEST_V3_TALIF_ONLY.json
  formal_results: results/formal_v3_talif_only
  pilot_results: results/pilot/v3_talif_only
  analysis_results: results/analysis/v3_talif_only

# Author-approved Phase A protocol. Phase B records do not yet exist, so the
# mandatory pilot and freeze gates still control all GPU and formal execution.
protocol_status:
  frozen: true
  confirmed_by: Yanzhao Deng; Peng Yan; Song Wang
  confirmed_at: "2026-07-28T19:18:37+08:00"
  notes: >-
    Author-approved TA-LIF-only v3 Phase A protocol. MS-ResNet, C3/C4,
    topology effects, and interaction claims are excluded from the current
    manuscript and retained only as historical code and audit evidence.
  confirmations:
    talif_only_scope_and_legacy_preservation: true
    reference_implementation_reviewed: true
    neuron_parameters: true
    data_preprocessing_and_splits: true
    optimizer_schedule_and_pilot_gates: true
    paired_accuracy_analysis_and_claim_gates: true
    deterministic_seeds_and_run_handling: true
    model_selection_and_one_time_test_access: true

pilot_acceptance:
  identity: v3_talif_only_c1_c2_e120
  artifact_class: non_reportable_pilot
  conditions: [C1, C2]
  datasets:
    cifar100:
      seed: 474123945
      health_output: results/pilot/v3_talif_only/health_cifar100_s474123945.json
      attempt_receipt: results/pilot/v3_talif_only/health_cifar100_s474123945.attempt.json
      pilot_output_root: results/pilot/v3_talif_only/cifar100_s474123945
      pilot_plan: environment/v3_talif_only_pilot_cifar100_s474123945.json
    cifar10dvs:
      seed: 799312121
      health_output: results/pilot/v3_talif_only/health_cifar10dvs_s799312121.json
      attempt_receipt: results/pilot/v3_talif_only/health_cifar10dvs_s799312121.attempt.json
      pilot_output_root: results/pilot/v3_talif_only/cifar10dvs_s799312121
      pilot_plan: environment/v3_talif_only_pilot_cifar10dvs_s799312121.json
  validation_output: results/pilot/v3_talif_only/validation.json
  environment:
    expected_gpu_substring: RTX 5090
    pytorch_version: 2.9.1+cu128
    cuda_runtime: '12.8'
    precision: float32
    deterministic: true
  overfit:
    batch_size: 8
    steps: 80
    minimum_accuracy: 0.50
    maximum_loss_fraction: 0.90
    minimum_ta_routed_gradient_coverage: 0.90
  timing:
    batch_size: 64
    warmup_steps: 2
    timed_steps: 5
    maximum_ta_enabled_over_frozen_ratio: 3.0
    epoch_time_ratio_conditions: [C2]
    ta_state_source: events_jsonl_epoch_completed_ta_enabled
  schedule:
    epochs: 120
    required_best_validation_accuracy: 0.60
    require_all_conditions_converged: true
    technical_interruption_policy: same_environment_last_checkpoint_resume_permitted
    cross_environment_resume: forbidden
    failed_or_interrupted_fresh_retry: forbidden
    failure_action: new_protocol_version_and_new_unused_seed

data:
  root: data
  val_fraction: 0.1
  split_seed: 2024
  split_manifest: data/manifests/{dataset}_seed{split_seed}.json
  normalize: true
  augment: true
  autoaugment: false
  download: true
  num_workers: 0
  pin_memory: true

datasets:
  cifar10:
    dataset: cifar10
    root: data/cifar10
    num_classes: 10
    in_channels: 3
  cifar100:
    dataset: cifar100
    root: data/cifar100
    num_classes: 100
    in_channels: 3
  cifar10dvs:
    dataset: cifar10dvs
    root: data/cifar10dvs
    normalize: false
    frames_path: data/cifar10dvs/processed
    test_frames_path: data/cifar10dvs/processed
    num_classes: 10
    in_channels: 2
    dvs_time_bins: 10
    dvs_height: 48
    dvs_width: 48
    dvs_resize_mode: nearest
    dvs_test_fraction: 0.2
    dvs_split_seed: 2024
    val_fraction: 0.125

# All four historical condition definitions remain available for audit. Only
# active_conditions controls the v3 matrix, and v3 run parsing rejects C3/C4.
conditions:
  C1:
    topology: spiking_resnet
    neuron: lif
  C2:
    topology: spiking_resnet
    neuron: ta_lif
  C3:
    topology: ms_resnet
    neuron: lif
  C4:
    topology: ms_resnet
    neuron: ta_lif

model:
  base_channels: 16
  neuron_cfg:
    tau: 0.5
    threshold: 1.0
    v_rest: 0.0
    v_reset: 0.0
    width: 1.0
    delta_min: 0.05

optimizer:
  epochs: 120
  batch_size: 64
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  milestones: [75, 90, 105]
  gamma: 0.1
  ta_start_fraction: 0.05
  ta_lr_scale: 0.1
  ta_weight_decay: 0.0
  grad_clip: null
  label_smoothing: 0.0
  cutmix_alpha: 0.0
  cutmix_probability: 0.0

runtime:
  device: auto
  checkpoint_every: 1
  log_every: 100
  amp: false
  deterministic: true
  dry_run: false
  limit_batches: null
  resume: null

experiments:
  E1: paired TA-LIF versus LIF accuracy evaluation
  E2: paired-seed statistical analysis of E1 outputs
  E3: descriptive diagnostics from frozen E1 checkpoints

analysis:
  collect_activity: false
  accuracy_scale: proportion
  validation_accuracy_thresholds:
    cifar100: 0.60
    cifar10dvs: 0.60
  convergence_epoch_rule: first_validation_epoch_at_or_above_threshold
  nonconvergence_rule: not_reached_by_final_epoch_no_exclusion
  failure_rule: nonfinite_loss_missing_best_checkpoint_or_unsuccessful_process_blocks_complete_pair
  alpha: 0.05
  confidence_level: 0.95
  primary_dataset: cifar100
  replication_dataset: cifar10dvs
  primary_accuracy_test:
    estimand: mean_seed_paired_c2_minus_c1_test_accuracy_pp
    blocking_factor: seed
    test_statistic: one_sample_t_over_seed_level_differences
    null_hypothesis: mean_delta_le_0
    alternative_hypothesis: mean_delta_gt_0
    sidedness: one_sided_greater
    estimation_interval: two_sided_95_percent_t
    degrees_of_freedom: 4
    decision_rule: p_lt_0_05_and_mean_delta_gt_0
    normality_pretest_switch: forbidden
    zero_variance_rule: not_estimable_primary_inconclusive
  replication_analysis:
    method: same_paired_t_estimate_interval_and_raw_differences
    role: prespecified_replication_external_validity_not_confirmatory
    cross_dataset_multiplicity: none_single_confirmatory_primary
    cannot_rescue_primary: true
  sign_flip:
    assignments: 32
    enumeration: all_2_power_5_seed_level_sign_flips
    sidedness: one_sided_greater
    role: sensitivity_only_cannot_rescue_primary
  bootstrap:
    resamples: 10000
    resampling_unit: complete_seed_pair
    cellwise_resampling: forbidden
    rng: numpy_generator_pcg64
    index_draw: integers_0_5_size_10000_by_5_endpoint_false
    statistic: mean_seed_paired_c2_minus_c1_test_accuracy_pp
    interval: two_sided_95_percent_percentile
    quantile_method: linear
    seeds:
      cifar100: 1033863572
      cifar10dvs: 1367073951
    role: sensitivity_only_cannot_rescue_primary
  model_selection:
    checkpoint: best.pt
    primary_order: maximum_validation_accuracy
    first_tie_breaker: minimum_validation_loss
    exact_tie_breaker: earliest_epoch
    test_based_selection: forbidden
  test_access:
    training_config_final_test: false
    when: after_all_20_runs_and_best_checkpoints_pass_frozen_audit
    access_count_per_checkpoint: 1
    reselection_or_repeated_evaluation: forbidden
    ambiguous_interruption: stop_document_and_obtain_author_decision
  run_handling:
    pilot_in_reportable_analysis: forbidden
    failed_run_records: retain
    seed_substitution: forbidden
    outlier_exclusion: forbidden
    nonconvergence_excludes_run: false
    incomplete_seed_pair: unresolved_no_partial_analysis
    cross_environment_checkpoint_resume: forbidden
    protocol_change_after_first_reportable_run: forbidden
  wording_gates:
    cifar100_improved: primary_p_lt_0_05_and_mean_delta_gt_0
    primary_not_passed: inconclusive_no_equivalence_or_no_effect_claim
    dvs_cannot_rescue_primary: true
    dvs_directional_support: mean_delta_gt_0
    dvs_replication_claim: one_sided_p_lt_0_05_and_mean_delta_gt_0
    cross_domain_improvement: both_dataset_tests_pass_and_both_means_gt_0
  efficiency:
    role: descriptive_only
    contrast: C2_over_C1_paired_within_seed
    metrics: [training_time, cuda_latency, peak_memory]
    confidence_interval: paired_two_sided_95_percent_t_on_log_ratio
    homogeneous_environment_required: true
    energy: not_assessed

benchmark:
  device_type: cuda
  precision: float32
  batch_sizes: [1, 128]
  warmup_iterations: 25
  timed_iterations: 100
  timing_method: synchronized_cuda_events
  input_residency: preloaded_on_device_before_warmup_and_timing
  energy_model:
    status: not_assessed
    constants_path: null
    constants_sha256: none
    source: none

matrix:
  primary:
    - {experiment: E1, dataset: cifar100, depth: 20, time_steps: 6}
    - {experiment: E1, dataset: cifar10dvs, depth: 20, time_steps: 10}
