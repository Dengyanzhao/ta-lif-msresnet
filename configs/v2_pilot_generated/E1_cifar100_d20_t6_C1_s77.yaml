protocol_version: 2
experiment: E1
data:
  dataset: cifar100
  root: data/cifar100
  num_classes: 100
  in_channels: 3
  val_fraction: 0.1
  split_seed: 2024
  split_manifest: data/manifests/cifar100_seed2024.json
  frames_path: null
  labels_path: null
  test_frames_path: null
  test_labels_path: null
  dvs_time_bins: 10
  dvs_height: 48
  dvs_width: 48
  dvs_resize_mode: nearest
  dvs_test_fraction: 0.2
  dvs_split_seed: 2024
  normalize: true
  augment: true
  autoaugment: false
  download: true
  num_workers: 0
  pin_memory: true
model:
  condition: C1
  topology: spiking_resnet
  neuron: lif
  depth: 20
  time_steps: 6
  num_classes: 100
  in_channels: 3
  base_channels: 16
  neuron_cfg:
    tau: 0.5
    threshold: 1.0
    v_rest: 0.0
    v_reset: 0.0
    width: 1.0
    delta_min: 0.05
optimizer:
  epochs: 120
  batch_size: 64
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  milestones:
  - 75
  - 90
  - 105
  gamma: 0.1
  ta_start_fraction: 0.05
  ta_lr_scale: 0.1
  ta_weight_decay: 0.0
  grad_clip: null
  label_smoothing: 0.0
  cutmix_alpha: 0.0
  cutmix_probability: 0.0
runtime:
  seed: 77
  device: auto
  output_dir: results/formal_v2
  run_id: E1_cifar100_d20_t6_C1_s77
  checkpoint_every: 1
  log_every: 100
  amp: false
  deterministic: true
  dry_run: false
  limit_batches: null
  resume: null
final_test: false
analysis:
  collect_activity: false
  accuracy_scale: proportion
  validation_accuracy_thresholds:
    cifar10: 0.7
    cifar100: 0.6
    cifar10dvs: 0.6
  convergence_epoch_rule: first_validation_epoch_at_or_above_threshold
  nonconvergence_rule: not_reached_by_final_epoch
  failure_rule: Non-finite loss, no valid best checkpoint, or unsuccessful process
    exit.
  alpha: 0.05
  confidence_level: 0.95
  interaction_practical_threshold_pp: 0.5
  primary_interaction_test:
    estimand: seed_level_difference_in_differences_pp
    blocking_factor: seed
    test_statistic: one_sample_t_over_seed_level_did
    null_hypothesis: delta_le_interaction_practical_threshold
    alternative_hypothesis: delta_gt_interaction_practical_threshold
    sidedness: one_sided_greater
    estimation_interval: two_sided_95_percent_t
  multiplicity_correction: holm_two_confirmatory_tests
  multiplicity_family: two_confirmatory_interaction_tests
  bootstrap:
    resamples: 10000
    seed: 20260719
    role: sensitivity_only
    resampling_unit: complete_seed_block
    cellwise_resampling: forbidden
    interval: two_sided_95_percent_percentile
  efficiency_assessment: descriptive
  efficiency_confidence_level: 0.95
  efficiency_noninferiority_margins:
    latency_b1_percent: 10.0
    latency_b128_percent: 10.0
    peak_memory_percent: 5.0
    modeled_energy_percent: 10.0
  efficiency_comparison:
    contrasts:
    - C2_over_C1
    - C4_over_C3
    pairing_unit: same_seed_within_topology_and_time_steps
    effect_scale: natural_log_ratio
    summary: geometric_percent_overhead
    confidence_interval: paired_two_sided_95_percent_t_on_log_ratio
    training_environment_rule: homogeneous_hardware_software_device_and_precision
    mixed_training_environment: analysis_blocked
    status_rules:
      point_estimate_gt_tolerance: exceeds_tolerance
      point_estimate_le_tolerance_ci_upper_gt_tolerance: within_tolerance_uncertain
      point_estimate_le_tolerance_ci_upper_le_tolerance: supported_within_tolerance
      unavailable_or_invalid: not_assessed
    overall_status_precedence:
    - exceeds_tolerance
    - within_tolerance_uncertain
    - not_assessed
    - supported_within_tolerance
  run_handling:
    pilot_in_confirmatory_analysis: forbidden
    pilot_scope: one_complete_c1_c4_seed_block_max_four_unique_runs
    pilot_plan: repository_global_immutable_plan
    pilot_output_root: separate_from_formal_results
    failed_run_records: retain
    seed_substitution: forbidden
    outlier_exclusion: forbidden
    nonconvergence_excludes_run: false
    incomplete_confirmatory_block: unresolved_no_partial_analysis
    protocol_change_after_first_confirmatory_run: forbidden
  wording_gates:
    synergy_precedence: true
    complementary_and_composable_may_both_apply: true
    synergistic: sesoi_shifted_one_sided_holm_reject
    complementary: synergy_not_supported_and_c4_minus_c3_95ci_lower_gt_0_and_c4_minus_c2_95ci_lower_gt_0
    composable_additive: interaction_90ci_within_plus_minus_0_50pp_and_c4_vs_c2_and_c3_one_sided_95ci_lower_gt_minus_0_50pp
    inconclusive: no_applicable_gate_supported_or_incomplete_block
  diagnostic_batches: 1
  diagnostic_batch_size: 8
  jacobian_probes: 8
  jacobian_seed: 20260719
  jacobian_time_index: -1
  matrix_key:
  - cifar100
  - 20
  - 6
  - C1
  - 77
  protocol_hash: c0b4e409bc8ed2e7e5ce1f9f18f38ebc5ec48328697cf53500997f8a34b1925d
