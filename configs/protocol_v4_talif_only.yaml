protocol_status:
  frozen: true
  confirmed_by: Yanzhao Deng (accountable author and Codex task user)
  confirmed_at: "2026-07-29T16:36:09+08:00"
  notes: >-
    The accountable author and Codex task user authorized all prospective v4
    settings and the gated execution workflow in the task transcript. This
    record does not assert independent signatures from Peng Yan or Song Wang.
    Training seeds were derived with SHA-256 from namespace
    ta-lif-msresnet/v4-author-freeze/2026-07-29 and role-specific labels, using
    the first eight digest bytes mapped to a positive 31-bit integer with
    historical-value and collision rejection. Formal execution remains
    mechanically blocked until both dataset health gates and pilots pass and
    the v4 freeze manifest verifies.
  confirmations:
    talif_only_dual_dataset_scope: true
    terminal_neuron_graph: true
    optimizer_and_scheduler: true
    ta_activation_contract: true
    data_preprocessing_and_splits: true
    health_and_pilot_gates: true
    deterministic_seed_derivation: true
    paired_accuracy_analysis_and_claim_gates: true
    environment_and_run_handling: true
    model_selection_and_one_time_test_access: true

pilot_acceptance:
  identity: v4_talif_only_repair_c1_c2_e120
  artifact_class: non_reportable_pilot
  conditions: [C1, C2]
  datasets:
    cifar100:
      seed: 1975342236
      health_output: results/pilot/v4_talif_only/health_cifar100_s1975342236.json
      attempt_receipt: results/pilot/v4_talif_only/health_cifar100_s1975342236.attempt.json
      pilot_output_root: results/pilot/v4_talif_only/cifar100_s1975342236
      pilot_plan: environment/v4_talif_only_pilot_cifar100_s1975342236.json
    cifar10dvs:
      seed: 1983855948
      health_output: results/pilot/v4_talif_only/health_cifar10dvs_s1983855948.json
      attempt_receipt: results/pilot/v4_talif_only/health_cifar10dvs_s1983855948.attempt.json
      pilot_output_root: results/pilot/v4_talif_only/cifar10dvs_s1983855948
      pilot_plan: environment/v4_talif_only_pilot_cifar10dvs_s1983855948.json
  validation_output: results/pilot/v4_talif_only/validation.json
  environment:
    expected_gpu_substring: RTX 5090
    pytorch_version: 2.9.1+cu128
    cuda_runtime: '12.8'
    precision: float32
    deterministic: true
  overfit:
    batch_size: 8
    steps: 80
    minimum_accuracy: 0.50
    maximum_loss_fraction: 0.90
    minimum_ta_routed_gradient_coverage: 0.90
  longitudinal_health:
    epochs: 3
    train_batches_per_epoch: 16
    validation_batches_per_epoch: 4
    minimum_residual_gradient_batch_coverage: 0.95
    minimum_surrogate_support_coverage: 0.001
    minimum_loss_reduction_fraction: 0.01
    parameter_norm_ratio_minimum: 0.50
    parameter_norm_ratio_maximum: 2.00
    maximum_nonfinite_observations: 0
  timing:
    batch_size: 64
    warmup_steps: 2
    timed_steps: 5
    maximum_ta_enabled_over_frozen_ratio: 3.0
    epoch_time_ratio_conditions: [C2]
    ta_state_source: events_jsonl_epoch_completed_ta_enabled
  schedule:
    epochs: 120
    required_best_validation_accuracy:
      cifar100: 0.30
      cifar10dvs: 0.50
    late_window_epochs: 10
    minimum_late_mean_accuracy:
      cifar100: 0.25
      cifar10dvs: 0.45
    minimum_late_to_best_ratio: 0.80
    minimum_post_warmup_residual_gradient_coverage: 0.95
    require_all_conditions_converged: true
    technical_interruption_policy: same_environment_last_checkpoint_resume_permitted
    cross_environment_resume: forbidden
    failed_or_interrupted_fresh_retry: forbidden
    failure_action: new_protocol_version_and_new_unused_seed

data:
  root: data
  val_fraction: 0.1
  split_seed: 2024
  split_manifest: data/manifests/{dataset}_seed{split_seed}.json
  normalize: true
  augment: true
  autoaugment: false
  download: true
  num_workers: 0
  pin_memory: true

datasets:
  cifar10:
    dataset: cifar10
    root: data/cifar10
    num_classes: 10
    in_channels: 3
  cifar100:
    dataset: cifar100
    root: data/cifar100
    num_classes: 100
    in_channels: 3
  cifar10dvs:
    dataset: cifar10dvs
    root: data/cifar10dvs
    normalize: false
    frames_path: data/cifar10dvs/processed
    test_frames_path: data/cifar10dvs/processed
    num_classes: 10
    in_channels: 2
    dvs_time_bins: 10
    dvs_height: 48
    dvs_width: 48
    dvs_resize_mode: nearest
    dvs_test_fraction: 0.2
    dvs_split_seed: 2024
    val_fraction: 0.125

# C3/C4 remain defined for historical parser compatibility but are inactive and
# forbidden in every v4 matrix.
conditions:
  C1:
    topology: spiking_resnet
    neuron: lif
  C2:
    topology: spiking_resnet
    neuron: ta_lif
  C3:
    topology: ms_resnet
    neuron: lif
  C4:
    topology: ms_resnet
    neuron: ta_lif

model:
  base_channels: 16
  terminal_neuron_mode: topology_required
  neuron_cfg:
    tau: 0.5
    threshold: 1.0
    v_rest: 0.0
    v_reset: 0.0
    width: 1.0
    delta_min: 0.05

optimizer:
  epochs: 120
  batch_size: 64
  lr: 0.025
  momentum: 0.9
  weight_decay: 0.0005
  milestones: [75, 90, 105]
  gamma: 0.1
  ta_start_fraction: 0.041666666666666664
  ta_lr_scale: 0.1
  ta_weight_decay: 0.0
  grad_clip: 1.0
  warmup_epochs: 5
  exclude_norm_and_bias_from_weight_decay: true
  label_smoothing: 0.0
  cutmix_alpha: 0.0
  cutmix_probability: 0.0

runtime:
  device: auto
  checkpoint_every: 1
  log_every: 100
  amp: false
  deterministic: true
  dry_run: false
  limit_batches: null
  resume: null

experiments:
  E1: paired TA-LIF versus LIF accuracy evaluation
  E2: paired-seed statistical analysis of E1 outputs
  E3: descriptive diagnostics from frozen E1 checkpoints

analysis:
  collect_activity: false
  accuracy_scale: proportion
  validation_accuracy_thresholds:
    cifar100: 0.60
    cifar10dvs: 0.60
  convergence_epoch_rule: first_validation_epoch_at_or_above_threshold
  nonconvergence_rule: not_reached_by_final_epoch_no_exclusion
  failure_rule: nonfinite_loss_missing_best_checkpoint_or_unsuccessful_process_blocks_complete_pair
  alpha: 0.05
  confidence_level: 0.95
  primary_dataset: cifar100
  replication_dataset: cifar10dvs
  primary_accuracy_test:
    estimand: mean_seed_paired_c2_minus_c1_test_accuracy_pp
    blocking_factor: seed
    test_statistic: one_sample_t_over_seed_level_differences
    null_hypothesis: mean_delta_le_0
    alternative_hypothesis: mean_delta_gt_0
    sidedness: one_sided_greater
    estimation_interval: two_sided_95_percent_t
    degrees_of_freedom: 4
    decision_rule: p_lt_0_05_and_mean_delta_gt_0
    normality_pretest_switch: forbidden
    zero_variance_rule: not_estimable_primary_inconclusive
  replication_analysis:
    method: same_paired_t_estimate_interval_and_raw_differences
    role: prespecified_replication_external_validity_not_confirmatory
    cross_dataset_multiplicity: none_single_confirmatory_primary
    cannot_rescue_primary: true
  sign_flip:
    assignments: 32
    enumeration: all_2_power_5_seed_level_sign_flips
    sidedness: one_sided_greater
    role: sensitivity_only_cannot_rescue_primary
  bootstrap:
    resamples: 10000
    resampling_unit: complete_seed_pair
    cellwise_resampling: forbidden
    rng: numpy_generator_pcg64
    index_draw: integers_0_5_size_10000_by_5_endpoint_false
    statistic: mean_seed_paired_c2_minus_c1_test_accuracy_pp
    interval: two_sided_95_percent_percentile
    quantile_method: linear
    seeds:
      cifar100: 874085245
      cifar10dvs: 2019339204
    role: sensitivity_only_cannot_rescue_primary
  model_selection:
    checkpoint: best.pt
    primary_order: maximum_validation_accuracy
    first_tie_breaker: minimum_validation_loss
    exact_tie_breaker: earliest_epoch
    test_based_selection: forbidden
  test_access:
    training_config_final_test: false
    when: after_all_20_runs_and_best_checkpoints_pass_frozen_audit
    access_count_per_checkpoint: 1
    reselection_or_repeated_evaluation: forbidden
    ambiguous_interruption: stop_document_and_obtain_author_decision
  run_handling:
    pilot_in_reportable_analysis: forbidden
    failed_run_records: retain
    seed_substitution: forbidden
    outlier_exclusion: forbidden
    nonconvergence_excludes_run: false
    incomplete_seed_pair: unresolved_no_partial_analysis
    cross_environment_checkpoint_resume: forbidden
    protocol_change_after_first_reportable_run: forbidden
  wording_gates:
    cifar100_improved: primary_p_lt_0_05_and_mean_delta_gt_0
    primary_not_passed: inconclusive_no_equivalence_or_no_effect_claim
    dvs_cannot_rescue_primary: true
    dvs_directional_support: mean_delta_gt_0
    dvs_replication_claim: one_sided_p_lt_0_05_and_mean_delta_gt_0
    cross_domain_improvement: both_dataset_tests_pass_and_both_means_gt_0
  efficiency:
    role: descriptive_only
    contrast: C2_over_C1_paired_within_seed
    metrics: [training_time, cuda_latency, peak_memory]
    confidence_interval: paired_two_sided_95_percent_t_on_log_ratio
    homogeneous_environment_required: true
    energy: not_assessed

benchmark:
  device_type: cuda
  precision: float32
  batch_sizes: [1, 128]
  warmup_iterations: 25
  timed_iterations: 100
  timing_method: synchronized_cuda_events
  input_residency: preloaded_on_device_before_warmup_and_timing
  energy_model:
    status: not_assessed
    constants_path: null
    constants_sha256: none
    source: none

matrix:
  primary:
    - experiment: E1
      dataset: cifar100
      depth: 20
      time_steps: 6
      seeds: [375760402, 595643067, 671880744, 1045910319, 615268440]
    - experiment: E1
      dataset: cifar10dvs
      depth: 20
      time_steps: 10
      seeds: [1230259817, 1487387499, 856172396, 1846577336, 1248366457]
