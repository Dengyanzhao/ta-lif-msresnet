[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-lif-msresnet"
version = "0.1.0"
description = "Reference implementation and reproducibility tools for the TA-LIF x MS-ResNet factorial study"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
event = ["tonic>=1.5,<1.7", "aedat>=2.2,<2.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
