[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-lif-msresnet"
version = "1.0.0"
description = "Reference implementation for the frozen paired TA-LIF versus LIF evaluation in a directly trained spiking ResNet"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Yanzhao Deng" },
  { name = "Peng Yan" },
  { name = "Song Wang" },
]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
event = ["tonic>=1.5,<1.7", "aedat>=2.2,<2.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
